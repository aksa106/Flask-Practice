<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
      <link rel="stylesheet" href ="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

      <header id="hero">
    <div class="hero-container">
    <div class="hero-text">
    
    <h1>Add Your Tasks</h1>
    
    
    
    </div>
    </div>
    </header>

     <main>

        <!--FORM SECTION OF PAGE-->
    <section id="task-form">
        <div class="form-container">
        <form>
    <fieldset class="task-details">
        <legend>Task Details</legend>

        <div class="field-group">
        <label for="text">Task name : </label>
       <input type="text" id="text" name="text" placeholder="Enter title">
        </div>

        <div class="field-group">
        <label for="desc">Text description : </label>
        <textarea id="desc" name="desc" placeholder="Enter task description"></textarea>
        </div>

        <div class="field-group">
        <label for="priority">Priority : </label>
        <select id="priority" name="priority">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>
        </div>

        <div class="field-group">
        <label for="date">due_date : </label>
        <input type="date" id="date" name="date" placeholder="Enter due_date">
        </div>
    </fieldset>
    <button type="submit" class="submit-btn">Add Task</button>
    </form>
    </div>

    </section>

    </main>

    <!--Footer section-->
    <footer id="footer">
        <div class="footer-container">
        <p>@ 2026 Task Manager</p>
        <p>All rights reserved</p>
        </div>
    </footer>
    
</body>
</html>
