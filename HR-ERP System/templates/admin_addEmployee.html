<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HR ERP System</title>
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

     <!-- Header -->
    <header class="site-header text-center">
        <h1>HR ERP System</h1>
    </header>

   <nav class="main-navigation">
    <a href="{{ url_for('admin_dashboard') }}">Home</a>
    <a href="{{ url_for('admin_addEmployee') }}">Add Employee</a>
    <a href="{{ url_for('admin_showEmployee') }}">Show Employee</a>
    <a href="{{ url_for('admin_searchEmployee') }}">Search Employee</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</nav>


    <!-- Main Content -->
    <main class="main-container">

        <!-- Welcome Section -->
        <section class="home-content">
            <h2>Employee Registration Form</h2>
        </section>

        <br>

        <section>
            <fieldset>
                
                    <form action="/save" method="POST">

                        Emp ID : <input type="text" name="txtEmpId" placeholder="Enter your id" class="form-control">
                        <br>

                        Name : <input type="text" name="txtname" placeholder="Enter your name" class="form-control">
                         <br>

                    

                        Email : <input type="email" name="txtemail" placeholder="Enter your Email" class="form-control">
                         <br>

                      

                        Mobile : <input type="text" name="txtmobile" placeholder="Enter your phone number" class="form-control">
                         <br>


                        Designation : <input type="text" name="txtdesignation" placeholder="Enter your designation" class="form-control">
                         <br>

                   

                        Salary : <input type="text" name="txtsalary" placeholder="Enter your salary" class="form-control">
                        <br>

                        <input type="submit" value="Register" class="btn btn-warning">


                    </form>
               
            </fieldset>
        </section>
















    </main>










    
</body>
</html>
