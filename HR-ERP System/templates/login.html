<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | HR ERP System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color: #e9e9e9;">

    <!-- Header -->
    <header class="container-fluid text-center py-4"
            style="background-color: #315982; color: white;">

        <h1>HR ERP System</h1>

    </header>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand"
         style="background-color: #143454;">

        <div class="container-fluid">

            <ul class="navbar-nav w-100 d-flex flex-row justify-content-between">

                <li class="nav-item">
                    <a href="index.html" class="nav-link text-white">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a href="index.html#about" class="nav-link text-white">
                        About Us
                    </a>
                </li>

                <li class="nav-item">
                    <a href="login.html"
                       class="nav-link text-white border border-warning border-3">
                        Admin Login
                    </a>
                </li>

                <li class="nav-item">
                    <a href="index.html#contact" class="nav-link text-white">
                        Contact Us
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- Main Layout -->
    <div class="container-fluid">

        <div class="row">

            <!-- Login Section -->
            <main class="col-md-9 py-5"
                  style="background-color: #e9e9e9; min-height: 450px;">

                <div class="mx-auto p-4"
                     style="max-width: 460px;
                            background-color: #4476ad;
                            border: 3px solid #315982;">

                    <h2 class="text-center fw-bold mb-4"
                        style="color: #ffdf00; font-size: 22px;">
                        Admin Login
                    </h2>

                    <form action="#" method="post">

                        <!-- Username -->
                        <div class="row align-items-center mb-3">

                            <label for="username"
                                   class="col-5"
                                   style="color: #ffdf00; font-size: 18px;">
                                Username
                            </label>

                            <div class="col-7">

                                <input type="text"
                                       id="username"
                                       name="username"
                                       class="form-control rounded-0"
                                       required>

                            </div>

                        </div>

                        <!-- Password -->
                        <div class="row align-items-center mb-4">

                            <label for="password"
                                   class="col-5"
                                   style="color: #ffdf00; font-size: 18px;">
                                Password
                            </label>

                            <div class="col-7">

                                <input type="password"
                                       id="password"
                                       name="password"
                                       class="form-control rounded-0"
                                       required>

                            </div>

                        </div>

                        <!-- Login Button -->
                        <div class="text-center">

                            <button type="submit"
                                    class="btn fw-bold px-5 py-2"
                                    style="background-color: #f29236;
                                           color: white;
                                           border: 3px solid white;
                                           border-radius: 12px;">

                                Login

                            </button>

                        </div>

                    </form>

                    <!-- Back to Home -->
                    <div class="text-center mt-4">

                        <a href="index.html"
                           class="text-white">
                            Back to Home
                        </a>

                    </div>

                </div>

            </main>

            <!-- Sidebar -->
            <aside class="col-md-3 py-3"
                   style="background-color: #477fbd; min-height: 450px;">

                <h2 class="text-center fw-bold"
                    style="color: #ffdf00; font-size: 22px;">
                    Sidebar
                </h2>

                <ul class="mt-5"
                    style="list-style: none; color: #102f4d;">

                    <li class="mb-3">----------</li>
                    <li class="mb-3">----------</li>
                    <li class="mb-3">----------</li>
                    <li class="mb-3">----------</li>
                    <li class="mb-3">----------</li>

                </ul>

            </aside>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
