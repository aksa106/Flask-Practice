<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HR ERP System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Header -->
    <header class="main-header">
        <h1>HR ERP System</h1>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand navbar-dark custom-navbar">

        <div class="container-fluid">

            <ul class="navbar-nav w-100 d-flex flex-row justify-content-between">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#about">
                        About Us
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active login-nav-link"
                       href="{{ url_for('login') }}">
                        Admin Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#contact">
                        Contact Us
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- Main Layout -->
    <div class="container-fluid">

        <div class="row main-layout">

            <!-- Main Content -->
            <main class="col-md-9 main-content">

                <section class="login-card">

                    <h2>Admin Login</h2>

                    <form action="{{ url_for('login') }}" method="GET">

                        <div class="form-row">
                            <label for="username">Username</label>

                            <input type="text"
                                   id="username"
                                   name="username"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-row">
                            <label for="password">Password</label>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="login-button">
                                Login
                            </button>
                        </div>

                    </form>

                </section>

            </main>

            <!-- Sidebar -->
            <aside class="col-md-3 custom-sidebar">

                <h2>Sidebar</h2>

                <ul class="sidebar-list">
                    <li>----------</li>
                    <li>----------</li>
                    <li>----------</li>
                    <li>----------</li>
                    <li>----------</li>
                </ul>

            </aside>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
