<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Students</title>
</head>
<body>

    <header><h2>Add Students</h2></header>


    <main>
        <section>
   <fieldset>
    <legend><strong>ADD YOUR INFO</strong></legend>

    <form action="/students" method="post">

    <label>Student Name : </label>
    <input type="text" name="student_name">
    <br>
    <br>

    <label>Roll Number : </label>
    <input type="text" name="roll_no">
    <br>
    <br>

    <label>Email : </label>
    <input type="email" name="email">
    <br>
    <br>

    

    <fieldset>
        <legend><strong>ENTER YOUR SCORE</strong></legend>
        <label>DBMS : </label>
        <input type="text" name="dbms">
        <br>
        <br>

        <label>PDSA : </label>
        <input type="text" name="pdsa">
        <br>
        <br>

        <label>SC : </label>
        <input type="text" name="sc">
        <br>
        <br>

    </fieldset>


   </fieldset>

   <input type="submit" value="submit">
</form>

</section>
</main>
</body>
</html>
